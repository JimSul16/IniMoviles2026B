<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Para seguimiento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="contenedor-principal">
    <div class="estado-box">
      <div class="icono-circulo vacio">
        <ion-icon name="bookmark-outline" class="estado-icon" aria-hidden="true"></ion-icon>
      </div>
      <h2 class="estado-titulo">Incidencias en seguimiento</h2>
      <p class="estado-descripcion">
        Supervisión de reportes marcados para control prioritario del inspector municipal.
      </p>
    </div>
  </div>
</ion-content>
